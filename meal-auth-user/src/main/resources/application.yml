spring:
  application:
    name: meal-auth-user
  datasource:
    url: ${AUTH_USER_DB_URL:jdbc:h2:mem:meal_auth_user;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
    username: ${AUTH_USER_DB_USERNAME:sa}
    password: ${AUTH_USER_DB_PASSWORD:}
    driver-class-name: ${AUTH_USER_DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    table: flyway_schema_history_auth
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: never
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
server:
  port: 8101
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
mealflow:
  auth:
    otp:
      mode: ${AUTH_OTP_MODE:redis}
      pepper: ${AUTH_OTP_PEPPER:mealflow-dev-otp-pepper}
      log-code: ${AUTH_OTP_LOG_CODE:true}
      test-code: ${AUTH_OTP_TEST_CODE:}
    session:
      pepper: ${AUTH_SESSION_PEPPER:mealflow-dev-session-pepper}
