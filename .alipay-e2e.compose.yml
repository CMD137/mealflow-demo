services:
  meal-payment:
    environment:
      PAYMENT_PROVIDER: alipay-sandbox
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:?ALIPAY_APP_ID is required}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:?ALIPAY_PRIVATE_KEY is required}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:?ALIPAY_PUBLIC_KEY is required}
      NGROK_URL: ${NGROK_URL:?NGROK_URL is required}
      ALIPAY_NOTIFY_URL: https://${NGROK_URL:?NGROK_URL is required}/payments/alipay/callback
    networks: [private, edge]

  alipay-ngrok:
    image: ngrok/ngrok:alpine
    profiles: [alipay-sandbox]
    command: http meal-gateway:8080 --url=${NGROK_URL:?NGROK_URL is required}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN is required}
    depends_on:
      - meal-gateway
    networks: [private, edge]
