spring:
  application:
    name: meal-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://127.0.0.1:5173
              - http://localhost:5174
              - http://127.0.0.1:5174
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - '*'
      routes:
        - id: meal-auth-user
          uri: lb://meal-auth-user
          predicates:
            - Path=/auth/**,/users/**
        - id: meal-merchant
          uri: lb://meal-merchant
          predicates:
            - Path=/merchant/**,/merchants/**
        - id: meal-catalog
          uri: lb://meal-catalog
          predicates:
            - Path=/catalog/**
        - id: meal-cart
          uri: lb://meal-cart
          predicates:
            - Path=/cart/**
        - id: meal-order
          uri: lb://meal-order
          predicates:
            - Path=/orders/**
        - id: meal-queue
          uri: lb://meal-queue
          predicates:
            - Path=/queue/**
        - id: meal-promotion
          uri: lb://meal-promotion
          predicates:
            - Path=/vouchers/**,/promotion/**
        - id: meal-payment
          uri: lb://meal-payment
          predicates:
            - Path=/payments/**
        - id: meal-fulfillment
          uri: lb://meal-fulfillment
          predicates:
            - Path=/fulfillment/**
        - id: meal-notify
          uri: lb://meal-notify
          predicates:
            - Path=/notify/**
        - id: meal-support
          uri: lb://meal-support
          predicates:
            - Path=/api/support/**
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
mealflow:
  gateway:
    auth:
      enabled: ${GATEWAY_AUTH_ENABLED:true}
      auth-user-uri: ${MEAL_AUTH_USER_URI:http://localhost:8101}
      timeout-ms: ${GATEWAY_AUTH_TIMEOUT_MS:3000}
  internal:
    auth:
      enabled: ${INTERNAL_AUTH_ENABLED:true}
      secret: ${INTERNAL_SECRET:mealflow-dev-internal-secret}
      service-name: ${INTERNAL_SERVICE_NAME:meal-gateway}
