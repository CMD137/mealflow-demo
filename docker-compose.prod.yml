services:
  nacos:
    environment:
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required in production}

  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in production}

  meal-auth-user:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_OTP_MODE: redis
      AUTH_OTP_LOG_CODE: "false"
      AUTH_OTP_PEPPER: ${AUTH_OTP_PEPPER:?AUTH_OTP_PEPPER is required in production}
      AUTH_SESSION_PEPPER: ${AUTH_SESSION_PEPPER:?AUTH_SESSION_PEPPER is required in production}

  meal-payment:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PAYMENT_PROVIDER: alipay-sandbox
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:?ALIPAY_APP_ID is required in production}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:?ALIPAY_PRIVATE_KEY is required in production}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:?ALIPAY_PUBLIC_KEY is required in production}

  meal-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GATEWAY_AUTH_ENABLED: "true"
