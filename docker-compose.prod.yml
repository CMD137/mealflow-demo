services:
  nacos:
    environment:
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required in production}

  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in production}

  meal-auth-user:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_OTP_MODE: redis
      AUTH_OTP_TEST_CODE: ""
      AUTH_OTP_LOG_CODE: "false"
      AUTH_OTP_PEPPER: ${AUTH_OTP_PEPPER:?AUTH_OTP_PEPPER is required in production}
      AUTH_SESSION_PEPPER: ${AUTH_SESSION_PEPPER:?AUTH_SESSION_PEPPER is required in production}

  meal-payment:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PAYMENT_PROVIDER: alipay-sandbox
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:?ALIPAY_APP_ID is required in production}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:?ALIPAY_PRIVATE_KEY is required in production}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:?ALIPAY_PUBLIC_KEY is required in production}
      NGROK_URL: ${NGROK_URL:?NGROK_URL is required in production}
      ALIPAY_NOTIFY_URL: https://${NGROK_URL:?NGROK_URL is required in production}/payments/alipay/callback
    networks: [private, edge]

  meal-support:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SUPPORT_INTERNAL_TOOL_TOKEN: ${SUPPORT_INTERNAL_TOOL_TOKEN:?SUPPORT_INTERNAL_TOOL_TOKEN is required in production}
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required in production}

  meal-support-agent-runtime:
    environment:
      SUPPORT_INTERNAL_TOOL_TOKEN: ${SUPPORT_INTERNAL_TOOL_TOKEN:?SUPPORT_INTERNAL_TOOL_TOKEN is required in production}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required in production}

  meal-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GATEWAY_AUTH_ENABLED: "true"

  alipay-ngrok:
    image: ngrok/ngrok:alpine
    profiles: [alipay-sandbox]
    command: http meal-gateway:8080 --url=${NGROK_URL:?NGROK_URL is required for alipay-sandbox}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN is required for alipay-sandbox}
    depends_on:
      - meal-gateway
    networks: [private, edge]
