spring:
  application:
    name: meal-promotion
  datasource:
    url: ${PROMOTION_DB_URL:jdbc:h2:mem:meal_promotion;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
    username: ${PROMOTION_DB_USERNAME:sa}
    password: ${PROMOTION_DB_PASSWORD:}
    driver-class-name: ${PROMOTION_DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: 8107
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:mealflow-promotion-seckill-producer}
mealflow:
  promotion:
    seckill:
      topic: ${SECKILL_EVENT_TOPIC:mealflow-seckill-commands}
    pending-recovery:
      enabled: ${PROMOTION_PENDING_RECOVERY_ENABLED:true}
      initial-delay-ms: ${PROMOTION_PENDING_RECOVERY_INITIAL_DELAY_MS:10000}
      fixed-delay-ms: ${PROMOTION_PENDING_RECOVERY_FIXED_DELAY_MS:5000}
      initial-timeout-ms: ${PROMOTION_PENDING_RECOVERY_INITIAL_TIMEOUT_MS:10000}
      batch-size: ${PROMOTION_PENDING_RECOVERY_BATCH_SIZE:100}
      max-backoff-ms: ${PROMOTION_PENDING_RECOVERY_MAX_BACKOFF_MS:300000}
  mq:
    seckill-consumer:
      enabled: ${SECKILL_EVENT_CONSUMER_ENABLED:true}
      group: ${SECKILL_EVENT_CONSUMER_GROUP:mealflow-promotion-seckill-consumer}
      topics: ${SECKILL_EVENT_TOPICS:mealflow-seckill-commands}
      max-reconsume-times: ${SECKILL_EVENT_MAX_RECONSUME_TIMES:5}
  internal:
    auth:
      enabled: ${INTERNAL_AUTH_ENABLED:true}
      secret: ${INTERNAL_SECRET:mealflow-dev-internal-secret}
      service-name: ${INTERNAL_SERVICE_NAME:meal-promotion}
